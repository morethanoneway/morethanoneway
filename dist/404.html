<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MoreThanOneWay</title>
    <script>
      // GitHub Pages 404 redirect trick
      // Converts /page-name into /?p=/page-name so index.html can handle it
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace(
        '/?p=' + encodeURIComponent(path + search + hash)
      );
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
